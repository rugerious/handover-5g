# Puts the k3s admin kubeconfig on the laptop, ready for the SSM tunnel:
# server https://127.0.0.1:16443, cluster/user/context named "handover".
# Run from the ansible/ folder:  ansible-playbook kubeconfig.yml
# The file holds the cluster's admin key: it lives in ~/.kube (mode 0600),
# never in the repo, and the key is never printed (no_log).

- name: Kubeconfig for the laptop
  hosts: handover-node-1
  gather_facts: false

  vars:
    kubeconfig_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/handover.yaml"
    tunnel_port: 16443

  tasks:
    - name: Private folder for kubeconfigs on the laptop
      ansible.builtin.file:
        path: "{{ kubeconfig_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Read the admin kubeconfig on the node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      become: true
      register: k3s_kubeconfig
      no_log: true

    - name: Write it on the laptop, pointed at the tunnel, named "handover"
      ansible.builtin.copy:
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
        content: >-
          {{ k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://127.0.0.1:' ~ tunnel_port)
             | regex_replace('(?m)^(\s*(?:- )?(?:name|cluster|user|current-context): )default$', '\g<1>handover') }}
      delegate_to: localhost
      no_log: true

    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "Kubeconfig: {{ kubeconfig_path }}"
          - "Open the tunnel in another tab, then: export KUBECONFIG={{ kubeconfig_path }} && kubectl get nodes"
