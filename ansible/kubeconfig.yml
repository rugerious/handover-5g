# Kubeconfig for the laptop, with a personal client certificate: the k3s admin
# key never leaves the node. Run from the ansible/ folder:
#
#   ansible-playbook kubeconfig.yml                 # daily: ~/.kube/handover.yaml
#   ansible-playbook kubeconfig.yml -e admin=true   # break glass: ~/.kube/handover-admin.yaml
#
# Daily:  user rugerious-<device>, certificate valid 45 days, renewed when less
#         than 7 days are left (running it again before that changes nothing).
#         Permissions: deploy/rbac/operator.yaml (read all but Secrets, logs,
#         RAN exec, restarts, Argo CD port-forward).
# Admin:  user rugerious-<device>-admin, certificate valid 1 hour, new on every
#         run. Admin only through the binding in deploy/rbac/break-glass.yaml;
#         on a brand-new cluster (no Argo CD yet) this playbook creates it once.
#
# The private key is made on the laptop and never leaves it; only the signing
# request goes to the node, where Kubernetes signs it (CSR API). One device name
# per laptop (-e device=...), so a lost laptop is cut off by deleting its lines
# in deploy/rbac/ - client certificates cannot be revoked, permissions can.

- name: Kubeconfig for the laptop
  hosts: handover-node-1
  gather_facts: false

  vars:
    device: desktop
    admin: false
    renew: false
    tunnel_port: 16443
    kube_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"
    cert_dir: "{{ kube_dir }}/certs"
    k8s_user: "rugerious-{{ device }}{{ '-admin' if admin | bool else '' }}"
    lifetime_s: "{{ 3600 if admin | bool else 3888000 }}"        # 1 hour / 45 days
    renew_before_s: 604800                                   # daily: renew with < 7 days left (admin: every run)
    key_path: "{{ cert_dir }}/{{ k8s_user }}.key"
    crt_path: "{{ cert_dir }}/{{ k8s_user }}.crt"
    csr_path: "{{ cert_dir }}/{{ k8s_user }}.csr"
    kubeconfig_path: "{{ kube_dir }}/handover{{ '-admin' if admin | bool else '' }}.yaml"
    context_name: "handover{{ '-admin' if admin | bool else '' }}"
    k3s: /usr/local/bin/k3s
    cluster_ca_path: /var/lib/rancher/k3s/server/tls/server-ca.crt

  tasks:
    - name: Refuse an unexpected device name
      ansible.builtin.assert:
        that: device is match('^[a-z0-9-]{1,30}$')
        fail_msg: "device '{{ device }}': use lowercase letters, digits and dashes"
        quiet: true

    - name: Private folder for the key and certificate on the laptop
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Is the current certificate still valid for long enough?
      ansible.builtin.command: openssl x509 -checkend {{ renew_before_s }} -noout -in {{ crt_path }}
      register: cert_check
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: New key and certificate
      when: renew | bool or admin | bool or cert_check.rc != 0
      block:
        - name: New private key on the laptop (never leaves it)
          ansible.builtin.shell: >-
            umask 077 && openssl genpkey -algorithm EC
            -pkeyopt ec_paramgen_curve:P-256 -out {{ key_path }}.new
          changed_when: true
          delegate_to: localhost

        - name: Signing request for the user (no group, so never system:masters)
          ansible.builtin.command: >-
            openssl req -new -key {{ key_path }}.new -subj /CN={{ k8s_user }} -out {{ csr_path }}
          changed_when: true
          delegate_to: localhost

        - name: Read the signing request (public)
          ansible.builtin.slurp:
            src: "{{ csr_path }}"
          register: csr_file
          delegate_to: localhost

        - name: Name for this request
          ansible.builtin.set_fact:
            csr_name: "{{ k8s_user }}-{{ lookup('ansible.builtin.pipe', 'date +%Y%m%d%H%M%S') }}"

        - name: Ask the cluster to sign it
          ansible.builtin.command:
            cmd: "{{ k3s }} kubectl apply -f -"
            stdin: |
              apiVersion: certificates.k8s.io/v1
              kind: CertificateSigningRequest
              metadata:
                name: {{ csr_name }}
              spec:
                request: {{ csr_file.content }}
                signerName: kubernetes.io/kube-apiserver-client
                expirationSeconds: {{ lifetime_s }}
                usages: ["client auth"]
          become: true
          changed_when: true

        - name: Approve it
          ansible.builtin.command: "{{ k3s }} kubectl certificate approve {{ csr_name }}"
          become: true
          changed_when: true

        - name: Collect the signed certificate
          ansible.builtin.command: >-
            {{ k3s }} kubectl get csr {{ csr_name }} -o jsonpath={.status.certificate}
          become: true
          register: signed
          until: signed.stdout | length > 0
          retries: 10
          delay: 2
          changed_when: false

        - name: Remove the request from the cluster
          ansible.builtin.command: "{{ k3s }} kubectl delete csr {{ csr_name }}"
          become: true
          changed_when: true

        - name: Save the certificate on the laptop
          ansible.builtin.copy:
            dest: "{{ crt_path }}.new"
            content: "{{ signed.stdout | b64decode }}"
            mode: "0600"
          delegate_to: localhost

        - name: Swap in the new key and certificate together
          ansible.builtin.shell: >-
            mv -f {{ key_path }}.new {{ key_path }} &&
            mv -f {{ crt_path }}.new {{ crt_path }} &&
            rm -f {{ csr_path }}
          changed_when: true
          delegate_to: localhost

    - name: Break glass on a new cluster - create the admin binding if missing (Git owns it after)
      when: admin | bool
      ansible.builtin.shell: >-
        {{ k3s }} kubectl get clusterrolebinding break-glass-{{ device }} >/dev/null 2>&1 ||
        {{ k3s }} kubectl create clusterrolebinding break-glass-{{ device }}
        --clusterrole=cluster-admin --user={{ k8s_user }}
      register: break_glass
      changed_when: "'created' in break_glass.stdout"
      become: true

    - name: Read the cluster's CA certificate (public)
      ansible.builtin.slurp:
        src: "{{ cluster_ca_path }}"
      register: cluster_ca
      become: true

    - name: Write the kubeconfig, pointed at the tunnel
      ansible.builtin.copy:
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
        content: "{{ kubeconfig | to_nice_yaml(indent=2) }}"
      vars:
        kubeconfig:
          apiVersion: v1
          kind: Config
          clusters:
            - name: handover
              cluster:
                server: "https://127.0.0.1:{{ tunnel_port }}"
                certificate-authority-data: "{{ cluster_ca.content }}"
          users:
            - name: "{{ k8s_user }}"
              user:
                client-certificate: "{{ crt_path }}"
                client-key: "{{ key_path }}"
          contexts:
            - name: "{{ context_name }}"
              context:
                cluster: handover
                user: "{{ k8s_user }}"
          current-context: "{{ context_name }}"
      delegate_to: localhost

    - name: Certificate expiry
      ansible.builtin.command: openssl x509 -enddate -noout -in {{ crt_path }}
      register: expiry
      changed_when: false
      delegate_to: localhost

    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "Kubeconfig: {{ kubeconfig_path }} (user {{ k8s_user }}, {{ expiry.stdout }})"
          - "With the tunnel open: export KUBECONFIG={{ kubeconfig_path }} && kubectl auth whoami"
