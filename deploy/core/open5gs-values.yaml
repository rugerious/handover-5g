# Open5GS 5G SA core for the Handover lab on k3s: Gradiant's community chart,
# one pod per network function. Chart and app versions: versions.yaml.
# Install from the laptop (SSM tunnel open):
#   helm upgrade --install open5gs oci://registry-1.docker.io/gradiantcharts/open5gs \
#     --version 2.3.11 -n core --create-namespace -f deploy/core/open5gs-values.yaml

# 5G SA only: the 4G parts (EPC) and roaming are off
hss: { enabled: false }
mme: { enabled: false }
pcrf: { enabled: false }
sgwc: { enabled: false }
sgwu: { enabled: false }
sepp: { enabled: false }
webui: { enabled: false }       # subscribers come from "populate" below

mongodb:
  image:
    tag: "7.0.45"               # NOT 8.x: MongoDB 8 refuses to start on kernel >= 6.19 (SERVER-121912); node runs 7.0
  persistence:
    enabled: true
    size: 1Gi                   # k3s local-path disk; survives a node stop/start

populate:
  enabled: false                # its command line would need the keys in Git; the
                                # subscriber is loaded by deploy/core-subscribers/ instead

amf:
  config:
    guamiList:
      - plmn_id: { mcc: "001", mnc: "01" }
        amf_id: { region: 2, set: 1 }
    taiList:
      - plmn_id: { mcc: "001", mnc: "01" }
        tac: [7]                # ONE TAC: srsUE cannot decode a multi-TAC list (bug 9)
    plmnList:
      - plmn_id: { mcc: "001", mnc: "01" }
        s_nssai:
          - sst: 1
    networkName: Handover
  services:
    ngap:
      clusterIP: 10.43.38.12    # fixed, so the gNB config can point at it (k3s services: 10.43.0.0/16)

nrf:
  config:
    servingList:
      - plmn_id: { mcc: "001", mnc: "01" }

smf:
  config:
    pcrf:
      enabled: false            # 4G policy function, not deployed

# PFCP: the UPF advertises its Service, so the SMF reaches it through one address only.
# Without this the SMF used the Service for association and the pod IP afterwards: conntrack clash, source port remapped, UPF "Cannot find PFCP-Node".
upf:
  # Least privilege (3.5): the UPF process attaches to ogstun, nothing more.
  # Not privileged; only NET_ADMIN and the one device /dev/net/tun (as the UE).
  # The chart's init container tun-create stays privileged: it is hard-coded in
  # the template, and its sysctl (ip_forward) needs a writable /proc/sys. It runs
  # once at start and exits (see README).
  containerSecurityContext:
    enabled: true
    runAsNonRoot: false
    runAsUser: 0                  # added capabilities only take effect for root; the image's
                                  # user (999) would get NET_ADMIN in the bounding set only
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      add: [NET_ADMIN]
  extraVolumes:
    - name: dev-tun
      hostPath:
        path: /dev/net/tun
        type: CharDevice
  extraVolumeMounts:
    - name: dev-tun
      mountPath: /dev/net/tun
  config:
    upf:
      pfcp:
        advertise: "open5gs-upf-pfcp.core.svc.cluster.local"
