# Monitoring namespace: nothing comes in except from inside the namespace
# (Grafana -> Prometheus, Prometheus -> Alertmanager and its own exporters).
# Outbound stays open: Prometheus has to reach everything it scrapes.
# Grafana and Prometheus are reached with kubectl port-forward, which these
# policies do not apply to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-within-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
