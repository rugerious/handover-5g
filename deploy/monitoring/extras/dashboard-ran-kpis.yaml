# Phase 4.4: the RAN KPI dashboard, as code. Grafana's dashboard sidecar loads
# every ConfigMap in this namespace labelled grafana_dashboard: "1"; edit the JSON
# here (the dashboard is read-only in Grafana, so Git stays the only source).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-ran-kpis
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ran-kpis.json: |
    {
      "uid": "handover-ran-kpis",
      "title": "Handover · RAN KPIs",
      "tags": [
        "handover",
        "ran",
        "5g"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "editable": false,
      "graphTooltip": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "description": "OCUDU gNB KPIs from apps/kpi-exporter (Phase 4.3), grouped as availability, accessibility, integrity and recovery. Defined in Git (deploy/monitoring/extras).",
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "datasource",
            "label": "Data source",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Repository",
          "type": "link",
          "url": "https://github.com/rugerious/handover-5g",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "Availability · is the cell on air?",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "gNB reporting",
          "description": "1 while the gNB sent a cell report in the last 5 s (exporter: gnb_up).",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(gnb_up)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "N2 link to the AMF",
          "description": "NGAP association between gNB and AMF (gnb_ngap_amf_connected).",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(gnb_ngap_amf_connected)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "UEs on the cell",
          "description": "UEs connected to the cell in the last report (gnb_cell_ues).",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(gnb_cell_ues)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "UE data path ready",
          "description": "RAN pod Ready = the UE can pass traffic through its tunnel (bug 21). Drives the watchdog.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(kube_deployment_status_replicas_ready{namespace=\"ran\",deployment=\"ran\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "gNB and N2 link over time",
          "description": "Gaps mean the gNB was not reporting (restart, node stopped).",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(gnb_up)",
              "legendFormat": "gNB reporting",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(gnb_ngap_amf_connected)",
              "legendFormat": "N2 link up",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Accessibility · can a phone get in?",
          "id": 7,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 11
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "RRC setup success",
          "description": "Successful / attempted RRC connection setups, since the gNB started (all causes).",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(gnb_rrc_connection_establishments_total{result=\"successful\"}) / sum(gnb_rrc_connection_establishments_total{result=\"attempted\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "noValue": "no data",
              "decimals": 1
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "PDU session setup success",
          "description": "Successful / requested PDU session setups, since the gNB started.",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(gnb_pdu_session_setups_total{result=\"successful\"}) / sum(gnb_pdu_session_setups_total{result=\"requested\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "noValue": "no data",
              "decimals": 1
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "PDU session failures",
          "description": "Failed PDU session setups, since the gNB started.",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(gnb_pdu_session_setups_total{result=\"failed\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Integrity · how good is the link?",
          "id": 11,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "UE throughput",
          "description": "Scheduled bit rate per direction (gnb_ue_bitrate_bits_per_second).",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (direction) (gnb_ue_bitrate_bits_per_second)",
              "legendFormat": "{{direction}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "HARQ BLER",
          "description": "NACK / (ACK + NACK) over 1 min, per direction (gnb_ue_harq_total). Measured 15 Nov under 5 pings/s: DL 0 %, UL about 1 %.",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (direction) (rate(gnb_ue_harq_total{result=\"nack\"}[1m])) / sum by (direction) (rate(gnb_ue_harq_total[1m]))",
              "legendFormat": "{{direction}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "MCS",
          "description": "Modulation and coding scheme index per direction (0–28). 0 while the UE has nothing to send: the gNB schedules nothing.",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (direction) (gnb_ue_mcs)",
              "legendFormat": "{{direction}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0,
              "max": 28
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "CQI",
          "description": "Channel quality reported by the UE (0–15).",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(gnb_ue_cqi)",
              "legendFormat": "CQI",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0,
              "max": 15
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Uplink SNR",
          "description": "PUSCH SNR measured by the gNB. ~5 dB is normal on this ZeroMQ link (0 dB gain).",
          "id": 16,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(gnb_ue_pusch_snr_db)",
              "legendFormat": "PUSCH SNR",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "dB",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0,
              "max": 10
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Recovery & cost · what happens when it breaks?",
          "id": 17,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 33
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "RAN pods in the last 24 h",
          "description": "1 = no restart. Each restart (watchdog or rollout) makes a new pod.",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 34
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(max_over_time(kube_pod_created{namespace=\"ran\"}[24h]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  }
                ]
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Exporter subscribed",
          "description": "1 while the KPI exporter is subscribed to the gNB's metrics.",
          "id": 19,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 34
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(gnb_exporter_websocket_connected)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto"
          },
          "fieldConfig": {
