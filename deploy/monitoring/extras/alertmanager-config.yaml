# Phase 4.5: Alertmanager's whole config, built by External Secrets because the
# SNS topic ARN contains the account ID (it lives in SSM, written by
# infra/alerts.tf). Our alerts (lab=handover, deploy/monitoring/extras/alerts-ran.yaml)
# go to SNS, which emails them; the chart's own alerts stay in the UI ("null").
# The email address is subscribed to the topic by CLI, never written here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-handover
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: alertmanager-handover
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        role-arn: "{{ .role }}"
        alertmanager.yaml: |
          route:
            receiver: "null"
            group_by: [alertname]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: email
                matchers:
                  - lab = "handover"
          receivers:
            - name: "null"
            - name: email
              sns_configs:
                - topic_arn: "{{ .topic }}"
                  send_resolved: true
                  sigv4:
                    region: eu-west-2
  data:
    - secretKey: topic
      remoteRef:
        key: /handover/alerts/topic-arn
    - secretKey: role
      remoteRef:
        key: /handover/alerts/alertmanager-role-arn
