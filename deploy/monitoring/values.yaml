# kube-prometheus-stack for the Handover lab (Phase 4.1). Chart version pinned in
# versions.yaml (observability.kube_prometheus_stack) and deploy/argocd/apps/monitoring.yaml.
# Single node, k3s: keep it small, keep the radio's CPU safe, nothing exposed.
fullnameOverride: kps

# k3s runs the controller-manager, scheduler, proxy and its datastore inside one
# process and does not expose them separately: scraping them would only produce
# permanent "target down" alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

prometheusOperator:
  # No admission webhook: it would be called by the API server from the node,
  # through the monitoring NetworkPolicy, and needs certificate jobs. Rules come
  # from Git; a bad rule shows up in the operator's log instead of being refused.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    retentionSize: 4GB               # below the 5Gi volume
    # Pick up ServiceMonitors / PodMonitors / rules from any namespace and release
    # (Open5GS and gNB exporters come in 4.2-4.3 from their own apps).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # Memory limit only: a CPU limit would throttle; the request gives it a fair share.
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests: { storage: 5Gi }

alertmanager:
  # Phase 4.5: the config comes from a Secret built by External Secrets
  # (deploy/monitoring/extras/alertmanager-config.yaml): our alerts (lab=handover)
  # go to the SNS topic, which emails them; everything else to "null".
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-handover
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    # Its own AWS identity, no keys: a service-account token made for AWS STS
    # (refreshed by Kubernetes, 1 h), exchanged for the handover-alertmanager
    # role (infra/alerts.tf: sns:Publish on one topic). The role ARN contains the
    # account ID, so it comes from the same Secret, not from Git.
    volumes:
      - name: aws-token
        projected:
          sources:
            - serviceAccountToken:
                audience: sts.amazonaws.com
                expirationSeconds: 3600
                path: token
    volumeMounts:
      - name: aws-token
        mountPath: /var/run/secrets/aws
        readOnly: true
    containers:
      - name: alertmanager
        env:
          - name: AWS_ROLE_ARN
            valueFrom:
              secretKeyRef: { name: alertmanager-handover, key: role-arn }
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/aws/token
          - name: AWS_REGION
            value: eu-west-2
          - name: AWS_STS_REGIONAL_ENDPOINTS
            value: regional

grafana:
  # Admin password from AWS SSM via External Secrets (deploy/monitoring/extras),
  # never in Git. Reached with kubectl port-forward, like Argo CD.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  testFramework:
    enabled: false                   # no Helm test pod: Argo CD does not run Helm tests
  persistence:
    enabled: false                   # dashboards will be code (4.4), nothing to keep
  # 15 Nov: 326Mi before our first dashboard (85% of the old 384Mi limit), with
  # 25 chart dashboards loaded; 512Mi leaves room for ours without an OOM kill.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }
