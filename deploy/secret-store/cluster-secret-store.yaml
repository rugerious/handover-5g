# AWS SSM Parameter Store, reached with OIDC federation (no access keys):
# External Secrets asks Kubernetes for a short-lived token for the service
# account below (audience sts.amazonaws.com) and exchanges it with AWS STS for
# the handover-eso role (infra/eso.tf): read-only, /handover/* only.
#
# The service account is created once outside Git (docs/runbook.md), because
# its role annotation contains the AWS account ID.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Only these namespaces may read secrets through this store.
  conditions:
    - namespaces:
        - core
        - ran
  provider:
    aws:
      service: ParameterStore
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: handover-ssm-reader
            namespace: external-secrets
            # No audiences here: External Secrets already asks for sts.amazonaws.com,
            # and AWS refuses a token that lists more than one audience.
