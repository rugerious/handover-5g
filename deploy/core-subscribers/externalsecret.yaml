# The test SIM's keys, copied from AWS SSM Parameter Store (step 3.3c) into a
# Kubernetes Secret by External Secrets. Git holds only where they live.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: subscriber-001010123456780
  namespace: core
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: subscriber-001010123456780
    creationPolicy: Owner
  data:
    - secretKey: k
      remoteRef:
        key: /handover/subscriber/001010123456780/k
    - secretKey: opc
      remoteRef:
        key: /handover/subscriber/001010123456780/opc
