# Default-deny NetworkPolicies for the 5G namespaces (step 3.4).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rugerious/handover-5g.git
    targetRevision: main
    path: deploy/network-policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:                 # on a new cluster the core/ran/monitoring namespaces may not exist yet
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
