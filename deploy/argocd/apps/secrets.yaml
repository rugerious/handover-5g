# How the cluster reaches AWS for secrets (step 3.3d): the ClusterSecretStore
# in deploy/secret-store/. Needs the External Secrets CRDs, so it retries until the
# operator above has installed them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rugerious/handover-5g.git
    targetRevision: main
    path: deploy/secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
