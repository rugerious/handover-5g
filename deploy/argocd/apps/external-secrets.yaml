# External Secrets Operator (step 3.3d): copies the lab's secrets from AWS SSM
# Parameter Store into Kubernetes Secrets. Chart version pinned (versions.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0          # versions.yaml: gitops.external_secrets.chart_version
    helm:
      releaseName: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # its CRDs are too large for client-side apply
