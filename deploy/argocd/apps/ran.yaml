# RAN: our own chart (charts/ran), gNB + srsUE in one pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ran
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rugerious/handover-5g.git
    targetRevision: main
    path: charts/ran
    helm:
      releaseName: ran
  destination:
    server: https://kubernetes.default.svc
    namespace: ran
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true  # the PodMonitor (4.3) needs the monitoring app's CRDs first
    retry:                                # ...so on a fresh cluster, try again until they exist
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
