# App of apps: the ONE thing applied by hand (bootstrap). After this, Argo CD
# reads deploy/argocd/apps/ on main and keeps the cluster equal to it.
#   kubectl apply -f deploy/argocd/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rugerious/handover-5g.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true        # an app removed from Git is removed from the cluster
      selfHeal: true     # a manual change in the cluster is put back to Git's version
