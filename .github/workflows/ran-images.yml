name: ran images

# Builds the lab's RAN images (OCUDU gNB, srsUE) at the commits pinned in
# versions.yaml and publishes them to GHCR, so k3s can pull them.
# Pull requests: build only (proves the Dockerfiles still work).
# main: build and push. CPU target x86-64-v3 (AVX2), not "native": the runner's
# CPU is not the node's, and a "native" binary can crash elsewhere.

on:
  pull_request:
    paths:
      - "lab/compose/gnb/**"
      - "lab/compose/srsue/**"
      - "versions.yaml"
      - ".github/workflows/ran-images.yml"
  push:
    branches: [main]
    paths:
      - "lab/compose/gnb/**"
      - "lab/compose/srsue/**"
      - "versions.yaml"
      - ".github/workflows/ran-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ran-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ocudu-gnb
            component: ocudu
            context: ocudu-src
            dockerfile: lab/compose/gnb/Dockerfile
          - image: srsue
            component: srsue
            context: lab/compose/srsue
            dockerfile: lab/compose/srsue/Dockerfile
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned version from versions.yaml
        id: v
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          for k in repo tag commit; do
            val=$(yq ".ran.${COMPONENT}.${k}" versions.yaml)
            if [ -z "$val" ] || [ "$val" = "null" ]; then
              echo "versions.yaml: ran.${COMPONENT}.${k} is missing" >&2; exit 1
            fi
            echo "${k}=${val}" >> "$GITHUB_OUTPUT"
          done
          if [ "$COMPONENT" = "srsue" ]; then
            echo "args=SRSRAN_4G_COMMIT=$(yq '.ran.srsue.commit' versions.yaml)" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch OCUDU at the pinned commit (gNB only)
        if: matrix.component == 'ocudu'
        env:
          REPO: ${{ steps.v.outputs.repo }}
          TAG: ${{ steps.v.outputs.tag }}
          COMMIT: ${{ steps.v.outputs.commit }}
        run: |
          git clone --depth 1 --branch "$TAG" "$REPO" ocudu-src
          head=$(git -C ocudu-src rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Tag $TAG now points to $head, not the pinned $COMMIT: stop and review" >&2
            exit 1
          fi

      - name: Free disk space (the gNB build is large)
        if: matrix.component == 'ocudu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (main only)
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=${{ steps.v.outputs.tag }}-sha-
            type=raw,value=${{ steps.v.outputs.tag }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=${{ matrix.image }} built from ${{ steps.v.outputs.repo }} at ${{ steps.v.outputs.commit }} (${{ steps.v.outputs.tag }})

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.v.outputs.args }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
