# Every version the lab runs, in one place. Change it here first, then in the
# code that uses it. Commits pin what a tag points to today, so a moved or
# re-created tag can never change what we build.

ran:
  ocudu:                       # gNB (Linux Foundation, formerly srsRAN Project)
    repo: https://gitlab.com/ocudu/ocudu.git
    tag: release_26_10
    commit: e0db566aac6e6376ddd60e83c84f58698fcc4d70   # 30 Sep 2026
    dockerfile: lab/compose/gnb/Dockerfile   # target gnb, ZeroMQ only (no UHD, DPDK, ROHC)
    radio: zmq                    # simulated radio, no antennas
  srsue:                       # simulated phone (srsRAN 4G)
    repo: https://github.com/srsran/srsRAN_4G.git
    tag: release_25_10
    commit: 6bcbd9e5bf8686aa7085202cd847c5ddd64a9c16
    build_flags: [ENABLE_ZEROMQ=ON, ENABLE_RF_PLUGINS=OFF]

core:
  open5gs:                     # Compose lab (2.1): built by OCUDU's docker/open5gs
    version: v2.7.6
  open5gs_k3s:                 # k3s lab (2.2): Gradiant community chart, one pod per function
    chart: oci://registry-1.docker.io/gradiantcharts/open5gs
    chart_version: 2.3.11
    app_version: "2.8.0"       # image gradiant/open5gs:2.8.0
    values: deploy/core/open5gs-values.yaml

cell:                          # first lab cell (band 3 FDD, srsUE-compatible)
  plmn: "00101"
  tac: 7
  band: 3
  dl_arfcn: 368500
  bandwidth_mhz: 20            # as in the official srsUE ZMQ example (10 MHz uplink failed, 1 Nov)
  scs_khz: 15

images:                        # built by .github/workflows/ran-images.yml, pushed on main
  registry: ghcr.io/rugerious/handover-5g    # ocudu-gnb, srsue
  cpu_target: x86-64-v3        # AVX2: CI builds on a different CPU than the node

platform:
  k3s: v1.35.9+k3s1
  kubectl: v1.35.9
  helm: v4.3.1
  ubuntu: "24.04"              # node OS (kernel 7.0 HWE)

tooling:
  terraform: 1.16.6
  aws_provider: 6.70.0
  ansible_core: 2.21.5
  amazon_aws_collection: 12.0.0
  aws_cli: 2.39.3
