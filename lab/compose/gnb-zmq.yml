# OCUDU gNB for the Compose test: one FDD cell in band 3, 20 MHz, 15 kHz SCS,
# ZeroMQ radio towards srsUE. Follows the official srsUE ZeroMQ example
# (gnb_zmq.yaml) except the gains: OCUDU's ZMQ driver requires 0 dB or less.
# 20 MHz on purpose: at 10 MHz large uplink messages failed CRC and the attach
# never completed. Values must match ue-zmq.conf.

cu_cp:
  amf:
    addrs: 10.53.1.2          # Open5GS AMF (5gc container)
    port: 38412               # NGAP over SCTP
    bind_addrs: 10.53.1.3     # this container
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq
  # gNB transmits on :2000, receives from the UE's :2001. The UE shares this
  # container's network namespace, so both ends are 127.0.0.1.
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12      # 20 MHz, as in the official example
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: warning          # "info" shows every PUSCH CRC and SINR (debugging)

pcap:
  ngap_enable: true           # N2 signalling capture, for Wireshark
  ngap_filename: /tmp/gnb_ngap.pcap
