# OCUDU gNB for the Compose test: one FDD cell in band 3, 10 MHz, 15 kHz SCS,
# ZeroMQ radio towards srsUE. Based on OCUDU configs/gnb_rf_b210_fdd_srsUE.yml
# (srsUE-compatible PDCCH settings), radio swapped from USRP B210 to ZMQ and
# bandwidth from 20 to 10 MHz (less CPU). Values must match ue-zmq.conf.

cu_cp:
  amf:
    addrs: 10.53.1.2          # Open5GS AMF (5gc container)
    port: 38412               # NGAP over SCTP
    bind_addrs: 10.53.1.3     # this container
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq
  # gNB transmits on its own :2000, receives from the UE's :2001
  device_args: tx_port=tcp://10.53.1.3:2000,rx_port=tcp://10.53.1.4:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 6       # 10 MHz (the 20 MHz example uses 12)
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: warning

pcap:
  ngap_enable: true           # N2 signalling capture, for Wireshark
  ngap_filename: /tmp/gnb_ngap.pcap
