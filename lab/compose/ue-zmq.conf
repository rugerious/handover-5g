# srsUE (srsRAN 4G release_25_10) for the Compose test: 5G SA, band 3, 10 MHz,
# ZeroMQ radio towards the OCUDU gNB. Values must match gnb-zmq.yml.
# USIM values are the public srsRAN/OCUDU test subscriber (also in open5gs.env).

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 11.52e6
nof_antennas = 1
device_name = zmq
# UE transmits on its own :2001, receives from the gNB's :2000
device_args = tx_port=tcp://10.53.1.4:2001,rx_port=tcp://10.53.1.3:2000,base_srate=11.52e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 52
nof_prb = 52

[pcap]
enable = none

[log]
all_level = warning
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
