# Phase 2 Compose test: Open5GS core + OCUDU gNB + srsUE over ZeroMQ (simulated
# radio), on the lab node. Proves the 5G works before it moves to Kubernetes.
# Based on OCUDU's docker/docker-compose.yml (release_26_10). No published ports.
# This is the configuration that first attached a UE (1 Nov 2026). The gNB and
# UE still run privileged, as in that test; privileges are cut down to the
# minimum when the lab moves to k3s (step 2.2), where each one is tested.
#
# On the node:  cd /opt/handover/repo/lab/compose && docker compose up -d
# Versions: see versions.yaml at the repo root.

name: handover-5g

services:
  5gc:
    container_name: open5gs_5gc
    image: handover/open5gs:v2.7.6
    build:
      context: ${OCUDU_DIR:-/opt/handover/src/ocudu}/docker/open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.6"
    env_file:
      - open5gs.env
    privileged: true          # the UPF creates its TUN device and NAT rules
    command: 5gc -c open5gs-5gc.yml
    volumes:
      # Our template replaces OCUDU's: the AMF serves TAC 7 only (see README)
      - ./open5gs/open5gs-5gc.yml.in:/open5gs/open5gs-5gc.yml.in:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.20 7777"]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        ipv4_address: 10.53.1.2

  gnb:
    container_name: ocudu_gnb
    image: handover/ocudu-gnb:release_26_10   # built from gnb/Dockerfile (see README)
    privileged: true          # as tested; to be reduced in step 2.2
    tty: true                 # the gNB console expects a terminal
    cap_add:
      - SYS_NICE                # real-time scheduling for the PHY threads
    volumes:
      - ./gnb-zmq.yml:/gnb-zmq.yml:ro
      - gnb-logs:/tmp
    command: gnb -c /gnb-zmq.yml
    depends_on:
      5gc:
        condition: service_healthy
    networks:
      ran:
        ipv4_address: 10.53.1.3

  srsue:
    container_name: srsue
    image: handover/srsue:release_25_10
    build:
      context: srsue
    privileged: true          # as tested; to be reduced in step 2.2
    cap_add:
      - NET_ADMIN               # create tun_srsue and its routes
      - SYS_NICE
    devices:
      - /dev/net/tun
    volumes:
      - ./ue-zmq.conf:/ue-zmq.conf:ro
      - ue-logs:/tmp
    command: srsue /ue-zmq.conf
    depends_on:
      - gnb
    # Same network namespace as the gNB, so the ZeroMQ "radio" runs over
    # 127.0.0.1, exactly as in the official srsUE tutorial.
    network_mode: "service:gnb"

volumes:
  gnb-logs:
  ue-logs:

networks:
  ran:
    ipam:
      config:
        - subnet: 10.53.1.0/24
