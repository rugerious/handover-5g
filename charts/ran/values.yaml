# Handover lab RAN: OCUDU gNB + srsUE in ONE pod, so the ZeroMQ "radio" runs
# over 127.0.0.1, exactly as in the Compose lab (lab/compose) that attached
# on 1 Nov 2026. Images are built by .github/workflows/ran-images.yml.

amf:
  addr: 10.43.38.12          # Open5GS AMF NGAP service, fixed in deploy/core/open5gs-values.yaml

gnb:
  image:
    repository: ghcr.io/rugerious/handover-5g/ocudu-gnb
    tag: release_26_10-sha-4b412c0   # immutable tag from the main build of PR #30
  # Least privilege (2.2d): only real-time scheduling for the radio threads.
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      add: [SYS_NICE]

ue:
  image:
    repository: ghcr.io/rugerious/handover-5g/srsue
    tag: release_25_10-sha-4b412c0
  startDelaySeconds: 15      # gNB first, then the UE (Compose waited 12 s)
  # SIM keys k and opc in AWS SSM Parameter Store (step 3.3c), never in Git
  usimParameterPath: /handover/subscriber/001010123456780
  # Least privilege (2.2d): create tun_srsue and its routes, real-time threads.
  # The only device it gets is /dev/net/tun (see templates/deployment.yaml).
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      add: [NET_ADMIN, SYS_NICE, NET_RAW]   # NET_RAW: ping, the test traffic of our "test phone"
