# srsUE for the k3s lab: same as lab/compose/ue-zmq.conf (5G SA, band 3, 20 MHz,
# ZeroMQ radio towards the gNB in the same pod). USIM keys come from AWS SSM
# (External Secrets): the placeholders below are filled in at start, in memory.

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
# UE transmits on :2001, receives from the gNB's :2000 (shared namespace: 127.0.0.1)
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none

[log]
all_level = warning
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = __UE_OPC__
k    = __UE_K__
imsi = 001010123456780
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
