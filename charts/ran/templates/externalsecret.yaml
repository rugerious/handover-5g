# The UE's SIM keys, copied from AWS SSM Parameter Store by External Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-usim
  labels:
    app.kubernetes.io/name: ran
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: {{ .Release.Name }}-usim
    creationPolicy: Owner
  data:
    - secretKey: k
      remoteRef:
        key: {{ .Values.ue.usimParameterPath }}/k
    - secretKey: opc
      remoteRef:
        key: {{ .Values.ue.usimParameterPath }}/opc
